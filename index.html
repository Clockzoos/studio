<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy-Script | Free Roblox Scripts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ENTROPY-SCRIPT</h1>
        <p>Free Roblox scripts, updated regularly. Find one, hit Get Script, and you're set.</p>
    </header>

    <!-- Tombol menuju Panel Upload / Admin -->
    <div class="admin-link">
        <a href="admin.html">+ Upload Script (Admin UI)</a>
    </div>

    <!-- Kolom Search -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search scripts..." onkeyup="searchScript()">
    </div>

    <!-- Daftar Skrip Dinamis -->
    <div class="script-grid" id="scriptList">
        <!-- Data akan dimuat otomatis lewat JavaScript -->
    </div>

    <script>
        function loadScripts() {
            let scripts = JSON.parse(localStorage.getItem('entropy_scripts')) || [
                {
                    title: "[FREE UGC] milkXP! OP SCRIPT (SUPER EASY UGC)",
                    image: "https://via.placeholder.com/300x150/222/ffbb00?text=MilkXP",
                    link: "https://pastebin.com"
                }
            ];

            let container = document.getElementById('scriptList');
            container.innerHTML = "";

            scripts.forEach((item) => {
                container.innerHTML += `
                    <div class="script-card" data-title="${item.title.toLowerCase()}">
                        <img src="${item.image}" alt="Thumbnail">
                        <div class="card-content">
                            <h3>${item.title}</h3>
                            <div class="card-footer">
                                <span>Entropy-Script</span>
                                <!-- Langsung buka link tujuan tanpa detail.html -->
                                <a href="${item.link}" target="_blank">Get Script →</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function searchScript() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('script-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        window.onload = loadScripts;
    </script>

</body>
</html>
