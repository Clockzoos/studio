<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy-Script | Free Roblox Scripts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ENTROPY-SCRIPT</h1>
        <p>Free Roblox scripts, updated regularly. Find one, hit Get Script, and you're set.</p>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search scripts..." onkeyup="searchScript()">
    </div>

    <!-- Dynamic Script Grid (Dikosongkan total di awal) -->
    <div class="script-grid" id="scriptList">
        <!-- Akan terisi otomatis jika ada data -->
    </div>

    <script>
        function loadScripts() {
            // Mengambil data dari localStorage, jika kosong maka array-nya benar-benar [] (kosong)
            let scripts = JSON.parse(localStorage.getItem('entropy_scripts')) || [];

            let container = document.getElementById('scriptList');
            container.innerHTML = "";

            // Jika kosong, tampilkan tulisan bersih bahwa belum ada skrip
            if (scripts.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #777; grid-column: 1 / -1; margin-top: 20px;">No scripts available yet.</p>`;
                return;
            }

            scripts.forEach((item) => {
                container.innerHTML += `
                    <div class="script-card" data-title="${item.title.toLowerCase()}">
                        <img src="${item.image}" alt="Thumbnail">
                        <div class="card-content">
                            <h3>${item.title}</h3>
                            <div class="card-footer">
                                <span>Entropy-Script</span>
                                <a href="${item.link}" target="_blank">Get Script →</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Search Function
        function searchScript() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('script-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        window.onload = loadScripts;
    </script>

</body>
</html>
