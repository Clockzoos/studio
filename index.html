    </header>

    <!-- Kolom Search -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search scripts..." onkeyup="searchScript()">
        <button>Search</button>
    </div>

    <!-- Daftar Skrip (Cards) -->
    <div class="script-grid" id="scriptList">
        <!-- Kartu 1 -->
        <div class="script-card" data-title="milkxp op script free ugc">

    <!-- Script JavaScript untuk Fitur Search sederhana -->
    <script>
        function searchScript() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('script-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
