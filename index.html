<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy-Script | Free Roblox Scripts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ENTROPY-SCRIPT</h1>
        <p>Free Roblox scripts, updated regularly. Find one, hit Get Script, and you're set.</p>
    </header>

    <!-- Upload Panel Link -->
    <div class="admin-link">
        <a href="admin.html">+ Upload Script (Admin UI)</a>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search scripts..." onkeyup="searchScript()">
    </div>

    <!-- Dynamic Script Grid -->
    <div class="script-grid" id="scriptList">
        <!-- Data loaded via JavaScript -->
    </div>

    <!-- CUSTOM DELETE MODAL (DI-SET DISPLAY NONE LANGSUNG DISINI) -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Delete Script?</h3>
            <p>This action cannot be undone. The script will be permanently removed.</p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-confirm-delete" onclick="executeDelete()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        let scriptToDeleteIndex = null;

        function loadScripts() {
            let scripts = JSON.parse(localStorage.getItem('entropy_scripts')) || [
                {
                    title: "[FREE UGC] milkXP! OP SCRIPT (SUPER EASY UGC)",
                    image: "https://via.placeholder.com/300x150/222/ffbb00?text=MilkXP",
                    link: "https://pastebin.com"
                }
            ];

            let container = document.getElementById('scriptList');
            container.innerHTML = "";

            scripts.forEach((item, index) => {
                container.innerHTML += `
                    <div class="script-card" data-title="${item.title.toLowerCase()}">
                        <!-- Delete Button -->
                        <button class="btn-delete" onclick="openDeleteModal(${index})" title="Delete Script">
                            🗑️
                        </button>
                        
                        <img src="${item.image}" alt="Thumbnail">
                        <div class="card-content">
                            <h3>${item.title}</h3>
                            <div class="card-footer">
                                <span>Entropy-Script</span>
                                <a href="${item.link}" target="_blank">Get Script →</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Open Custom Modal
        function openDeleteModal(index) {
            scriptToDeleteIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        // Close Custom Modal
        function closeDeleteModal() {
            scriptToDeleteIndex = null;
            document.getElementById('deleteModal').style.display = 'none';
        }

        // Execute Delete
        function executeDelete() {
            if (scriptToDeleteIndex !== null) {
                let scripts = JSON.parse(localStorage.getItem('entropy_scripts')) || [];
                scripts.splice(scriptToDeleteIndex, 1);
                localStorage.setItem('entropy_scripts', JSON.stringify(scripts));
                closeDeleteModal();
                loadScripts();
            }
        }

        // Search Function
        function searchScript() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('script-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        window.onload = loadScripts;
    </script>

</body>
</html>
