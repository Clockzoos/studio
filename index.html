<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy-Script | Free Roblox Scripts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ENTROPY-SCRIPT</h1>
        <p>Free Roblox scripts, updated regularly. Find one, hit Get Script, and you're set.</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search scripts..." onkeyup="searchScript()">
    </div>

    <div class="script-grid" id="scriptList">
        <p style="text-align: center; color: #777; grid-column: 1 / -1; margin-top: 20px;" id="loadingText">Loading scripts...</p>
    </div>

    <script>
        const NPOINT_ID = "c3aac946d63fa3d2f04c";

        async function loadScripts() {
            let container = document.getElementById('scriptList');
            try {
                let response = await fetch(`https://api.npoint.io/${NPOINT_ID}`);
                let scripts = await response.json();

                container.innerHTML = "";

                if (!Array.isArray(scripts) || scripts.length === 0) {
                    container.innerHTML = `<p style="text-align: center; color: #777; grid-column: 1 / -1; margin-top: 20px;">No scripts available yet.</p>`;
                    return;
                }

                scripts.forEach((item) => {
                    container.innerHTML += `
                        <div class="script-card" data-title="${item.title.toLowerCase()}">
                            <img src="${item.image}" alt="Thumbnail">
                            <div class="card-content">
                                <h3>${item.title}</h3>
                                <div class="card-footer">
                                    <span>Entropy-Script</span>
                                    <a href="${item.link}" target="_blank">Get Script →</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = `<p style="text-align: center; color: #ff5555; grid-column: 1 / -1; margin-top: 20px;">Failed to load scripts.</p>`;
            }
        }

        function searchScript() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('script-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                if (title && title.includes(input)) {
                    cards[i].style.display = "";
                } else if(cards[i]) {
                    cards[i].style.display = "none";
                }
            }
        }

        window.onload = loadScripts;
    </script>
</body>
</html>
