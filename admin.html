<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy - Secure Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f0f; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .card { background: #161616; border: 1px solid #333; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-sizing: border-box; box-shadow: 0 8px 24px rgba(0,0,0,0.8); text-align: center; }
        h2 { color: #ffbb00; margin-bottom: 5px; }
        p.subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #0f0f0f; color: #fff; border: 1px solid #333; border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
        .form-group textarea { resize: vertical; min-height: 140px; font-family: monospace; }
        
        .tag-input-wrapper { display: flex; gap: 8px; align-items: center; }
        .tag-input-wrapper input { flex-grow: 1; }
        .btn-add-tag { background: #222; color: #ffbb00; border: 1px solid #ffbb00; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; white-space: nowrap; }
        
        .added-tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .selected-tag-chip { background: rgba(255, 187, 0, 0.2); color: #ffbb00; border: 1px solid #ffbb00; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: bold; }
        .selected-tag-chip span { cursor: pointer; color: #ff5555; font-weight: bold; font-size: 14px; }
        
        .btn-submit { width: 100%; background: #28a745; color: white; padding: 12px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 15px; }
        .btn-submit:hover { background: #218838; }
        .btn-settings { width: 100%; background: #333; color: #ffbb00; border: 1px solid #ffbb00; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 13px; }
        .btn-back:hover { color: #fff; }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { background: #161616; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #333; color: #fff; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- LOGIN BOX -->
    <div class="card" id="loginCard">
        <h2>ADMIN LOGIN</h2>
        <p class="subtitle">Enter password to access admin panel</p>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="loginPasswordInput" placeholder="Enter admin password">
        </div>
        <button class="btn-submit" onclick="verifyLogin()">Login</button>
        <a href="./" class="btn-back">← Back to Main Hub</a>
    </div>

    <!-- ADMIN PANEL -->
    <div class="card" id="adminContainer" style="display: none; max-width: 500px; text-align: left;">
        <h2>ENTROPY ADMIN</h2>
        <p class="subtitle" style="text-align: center;">Publish scripts & control custom IDs</p>

        <form onsubmit="submitAdminScript(event)">
            <div class="form-group">
                <label>Custom Post ID (e.g. 39625):</label>
                <input type="text" id="customScriptId" placeholder="e.g. 39625" required>
            </div>

            <div class="form-group">
                <label>Creator Name:</label>
                <input type="text" id="hubName" value="Nafyari" required>
            </div>

            <div class="form-group">
                <label>Script Title:</label>
                <input type="text" id="scriptTitle" placeholder="e.g. Title Owner" required>
            </div>

            <div class="form-group">
                <label>Category Type:</label>
                <select id="categoryType" onchange="handleCategoryChange()" required>
                    <option value="script">Script</option>
                    <option value="toolbox_id">ToolBox ID</option>
                    <option value="game_copying">Game Copying</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tags (3-6 Tags):</label>
                <div class="tag-input-wrapper">
                    <input type="text" id="tagInputBox" placeholder="Type a tag..." oninput="checkTagInput()">
                    <button type="button" class="btn-add-tag" id="addTagBtn" onclick="addTagFromInput()">Add</button>
                </div>
                <div id="addedTagsList" class="added-tags-container"></div>
            </div>

            <div class="form-group">
                <label id="linkFieldLabel">Script / Code Content:</label>
                <textarea id="scriptContentInput" placeholder="Paste Lua script here..." required style="white-space: pre;"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Publish Post 🚀</button>
        </form>

        <button class="btn-settings" onclick="openPasswordModal()">⚙️ Change Password</button>
        <button class="btn-settings" onclick="openDeviceLimitModal()">🛡️ Set Max Admin Devices</button>
        <button class="btn-settings" onclick="logoutAdmin()" style="background: #552222; border-color: #ff5555;">🚪 Logout This Device</button>
        <a href="./" class="btn-back" style="text-align: center;">← Back to Main Hub</a>
    </div>

    <!-- PASSWORD SETTINGS MODAL -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #ffbb00; margin-top: 0;">Change Admin Password</h3>
            <div class="form-group">
                <label>New Password:</label>
                <input type="password" id="newAdminPasswordInput" placeholder="Enter new password">
            </div>
            <button class="btn-submit" onclick="saveNewPassword()">Save Password</button>
            <button class="btn-settings" onclick="closePasswordModal()" style="margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <!-- DEVICE LIMIT MODAL -->
    <div id="deviceLimitModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #ffbb00; margin-top: 0;">Max Admin Devices</h3>
            <p style="color: #aaa; font-size: 13px;">Limit how many devices can be logged in as admin simultaneously.</p>
            <div class="form-group">
                <label>Max Devices Allowed:</label>
                <input type="number" id="maxDevicesInput" min="1" max="10" value="1">
            </div>
            <button class="btn-submit" onclick="saveDeviceLimit()">Save Limit</button>
            <button class="btn-settings" onclick="closeDeviceLimitModal()" style="margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <!-- CUSTOM ALERT MODAL -->
    <div id="customAlertModal" class="modal">
        <div class="modal-content">
            <div id="customAlertMessage" style="margin-bottom: 20px; font-size: 15px;">Message</div>
            <button class="btn-submit" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <script>
        function getAdminPassword() {
            return localStorage.getItem("entropy_admin_pw") || "nafyari_rahasia";
        }

        function getMaxDevices() {
            return parseInt(localStorage.getItem("entropy_max_devices") || "1");
        }

        function getRegisteredDevices() {
            try {
                let list = JSON.parse(localStorage.getItem("entropy_admin_devices") || "[]");
                return Array.isArray(list) ? list : [];
            } catch(e) {
                return [];
            }
        }

        function getMyDeviceId() {
            let id = localStorage.getItem("entropy_my_device_id");
            if (!id) {
                id = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem("entropy_my_device_id", id);
            }
            return id;
        }

        window.onload = function() {
            let myId = getMyDeviceId();
            let registeredDevices = getRegisteredDevices();
            let isLoggedHere = localStorage.getItem("entropy_admin_logged") === "true";

            let isRegistered = registeredDevices.includes(myId);

            if (!isRegistered && isLoggedHere) {
                localStorage.removeItem("entropy_admin_logged");
                isLoggedHere = false;
            }

            if (isLoggedHere && isRegistered) {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('adminContainer').style.display = 'block';
                handleCategoryChange();
            } else {
                document.getElementById('loginCard').style.display = 'block';
                document.getElementById('adminContainer').style.display = 'none';
            }
        };

        function verifyLogin() {
            let pass = document.getElementById('loginPasswordInput').value.trim();
            let correctPw = getAdminPassword();
            let maxDevs = getMaxDevices();
            let registeredDevices = getRegisteredDevices();
            let myId = getMyDeviceId();

            if (pass !== correctPw) {
                alert("Incorrect Password!");
                return;
            }

            if (!registeredDevices.includes(myId)) {
                if (registeredDevices.length >= maxDevs) {
                    alert("Access Denied! Maximum admin devices limit reached (" + maxDevs + "). New devices are automatically kicked/blocked.");
                    window.location.href = "./";
                    return;
                }
                registeredDevices.push(myId);
                localStorage.setItem("entropy_admin_devices", JSON.stringify(registeredDevices));
            }

            localStorage.setItem("entropy_admin_logged", "true");
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            handleCategoryChange();
        }

        function logoutAdmin() {
            let myId = getMyDeviceId();
            let registeredDevices = getRegisteredDevices();
            let index = registeredDevices.indexOf(myId);
            if (index > -1) {
                registeredDevices.splice(index, 1);
                localStorage.setItem("entropy_admin_devices", JSON.stringify(registeredDevices));
            }
            localStorage.removeItem("entropy_admin_logged");
            window.location.href = "./";
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
        }
        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }
        function saveNewPassword() {
            let newPw = document.getElementById('newAdminPasswordInput').value.trim();
            if (!newPw) { showAlert("Password cannot be empty!"); return; }
            localStorage.setItem("entropy_admin_pw", newPw);
            closePasswordModal();
            showAlert("Admin password successfully updated!");
        }

        function openDeviceLimitModal() {
            document.getElementById('maxDevicesInput').value = getMaxDevices();
            document.getElementById('deviceLimitModal').style.display = 'flex';
        }
        function closeDeviceLimitModal() {
            document.getElementById('deviceLimitModal').style.display = 'none';
        }
        function saveDeviceLimit() {
            let limit = parseInt(document.getElementById('maxDevicesInput').value);
            if (isNaN(limit) || limit < 1 || limit > 10) {
                showAlert("Please enter a valid number between 1 and 10.");
                return;
            }
            localStorage.setItem("entropy_max_devices", limit.toString());
            closeDeviceLimitModal();
            showAlert("Max admin devices updated to " + limit + "!");
        }

        const PUBLIC_BIN_ID = "6aef05abac6210605a74f72a";
        const MASTER_KEY = "$2a$10$7kUozSyzkNytbUxnN7/kv.xInV14ItUgvNAWdjKEswZ0M.DDWgL/e";
        const DEFAULT_AUTO_IMAGE = "https://tr.rbxcdn.com/180DAY-2944a7f2090621fd07d89499ea40fa46/500/280/Image/Jpeg/noFilter";

        let selectedTags = [];
        let alertCallback = null;

        function showAlert(msg, cb = null) {
            document.getElementById('customAlertMessage').innerText = msg;
            document.getElementById('customAlertModal').style.display = 'flex';
            alertCallback = cb;
        }

        function closeCustomAlert() {
            document.getElementById('customAlertModal').style.display = 'none';
            if (typeof alertCallback === 'function') alertCallback();
        }

        function handleCategoryChange() {
            let cat = document.getElementById('categoryType').value;
            let linkLabel = document.getElementById('linkFieldLabel');
            let linkInput = document.getElementById('scriptContentInput');
            selectedTags = [];

            if (cat === 'script') {
                selectedTags.push('script');
                linkLabel.innerText = "Script / Code Content:";
                linkInput.placeholder = "Paste your Lua script here directly...";
            } else if (cat === 'toolbox_id') {
                selectedTags.push('toolbox');
                linkLabel.innerText = "Toolbox ID:";
                linkInput.placeholder = "Enter ID Toolbox...";
            } else if (cat === 'game_copying') {
                selectedTags.push('uncopylocked');
                linkLabel.innerText = "Games ID:";
                linkInput.placeholder = "Enter Place ID...";
            }
            renderTags();
        }

        function checkTagInput() {
            let val = document.getElementById('tagInputBox').value.trim();
            document.getElementById('addTagBtn').style.display = val.length > 0 ? 'inline-block' : 'none';
        }

        function addTagFromInput() {
            let input = document.getElementById('tagInputBox');
            let val = input.value.trim().toLowerCase();
            if (!val) return;
            if (selectedTags.length >= 6) { showAlert('Maximum 6 tags allowed.'); return; }
            if (!selectedTags.includes(val)) {
                selectedTags.push(val);
                input.value = "";
                document.getElementById('addTagBtn').style.display = 'none';
                renderTags();
            } else {
                showAlert('Tag already added.');
            }
        }

        function removeTag(index) {
            let cat = document.getElementById('categoryType').value;
            selectedTags.splice(index, 1);
            if (cat === 'script' && !selectedTags.includes('script')) selectedTags.unshift('script');
            if (cat === 'toolbox_id' && !selectedTags.includes('toolbox')) selectedTags.unshift('toolbox');
            if (cat === 'game_copying' && !selectedTags.includes('uncopylocked')) selectedTags.unshift('uncopylocked');
            renderTags();
        }

        function renderTags() {
            let container = document.getElementById('addedTagsList');
            container.innerHTML = "";
            selectedTags.forEach((tag, idx) => {
                container.innerHTML += `<div class="selected-tag-chip">#${tag} <span onclick="removeTag(${idx})">&times;</span></div>`;
            });
        }

        async function submitAdminScript(event) {
            event.preventDefault();
            let customId = document.getElementById('customScriptId').value.trim();
            let hubName = document.getElementById('hubName').value.trim();
            let title = document.getElementById('scriptTitle').value.trim();
            let category = document.getElementById('categoryType').value;
            let link = document.getElementById('scriptContentInput').value;
            let submitBtn = document.getElementById('submitBtn');

            if (selectedTags.length < 3 || selectedTags.length > 6) {
                showAlert('Please ensure you have between 3 and 6 tags added.');
                return;
            }

            submitBtn.innerText = "Publishing...";
            submitBtn.disabled = true;

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${PUBLIC_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                let data = await res.json();
                let scripts = data.record || [];
                if (!Array.isArray(scripts)) scripts = [];

                let exists = scripts.find(item => item.id === customId);
                if (exists) {
                    showAlert('Error: ID "' + customId + '" is already taken! Use another ID.');
                    submitBtn.innerText = "Publish Post 🚀";
                    submitBtn.disabled = false;
                    return;
                }

                scripts.unshift({
                    id: customId,
                    hubName,
                    title,
                    category,
                    tags: selectedTags.join(','),
                    image: DEFAULT_AUTO_IMAGE,
                    link
                });

                let putRes = await fetch(`https://api.jsonbin.io/v3/b/${PUBLIC_BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify(scripts)
                });

                if (putRes.ok) {
                    showAlert('Success! Post published with ID #' + customId, () => {
                        window.location.href = "./#" + customId;
                    });
                } else {
                    showAlert('Failed to save to server.');
                    submitBtn.innerText = "Publish Post 🚀";
                    submitBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                showAlert('Connection error.');
                submitBtn.innerText = "Publish Post 🚀";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
