<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Entropy-Script</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>UPLOAD SCRIPT</h1>
        <p>Add a new script to display it on the main page</p>
    </header>

    <div class="admin-link">
        <a href="index.html">← Back to Home</a>
    </div>

    <!-- Upload Form UI -->
    <div class="admin-form-container">
        <form id="uploadForm" onsubmit="saveScript(event)">
            <div class="form-group">
                <label>Script Title:</label>
                <input type="text" id="scriptTitle" placeholder="Example: Blox Fruits Auto Farm..." required>
            </div>
            
            <div class="form-group">
                <label>Thumbnail Image URL:</label>
                <input type="text" id="scriptImage" placeholder="https://imgur.com/example.jpg" required>
            </div>

            <div class="form-group">
                <label>Script Link (Pastebin / Luarmor):</label>
                <input type="text" id="scriptLink" placeholder="https://pastebin.com/..." required>
            </div>

            <button type="submit" class="btn-submit">Publish Script Now</button>
        </form>
    </div>

    <script>
        function saveScript(event) {
            event.preventDefault();

            let title = document.getElementById('scriptTitle').value;
            let image = document.getElementById('scriptImage').value;
            let link = document.getElementById('scriptLink').value;

            let scripts = JSON.parse(localStorage.getItem('entropy_scripts')) || [];

            scripts.unshift({
                title: title,
                image: image,
                link: link
            });

            localStorage.setItem('entropy_scripts', JSON.stringify(scripts));

            alert('Script successfully added!');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
