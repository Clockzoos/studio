<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Upload - Entropy-Script</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <style>
        .img-container { max-width: 100%; max-height: 300px; margin-bottom: 15px; display: none; }
        .img-container img { max-width: 100%; display: block; }
        .btn-crop { background-color: #222; color: #38bdf8; border: 1px solid #38bdf8; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; display: none; width: 100%; }
        #croppedPreview { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; display: none; border: 1px dashed #38bdf8; }
    </style>
</head>
<body>

    <header>
        <h1>UPLOAD SCRIPT</h1>
        <p>Upload your script and thumbnail to the review queue.</p>
    </header>

    <div class="admin-link">
        <a href="index.html">← Back to Homepage</a>
    </div>

    <div class="admin-form-container" style="max-width: 600px; margin: 20px auto; background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155;">
        <form id="uploadForm" onsubmit="submitToQueue(event)">
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom: 5px;">Script Title:</label>
                <input type="text" id="scriptTitle" placeholder="e.g. Blox Fruits Auto Farm" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom: 5px;">Thumbnail Image:</label>
                <input type="file" id="imageInput" accept="image/*" style="padding: 8px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; width: 100%;">
            </div>

            <div class="img-container" id="cropperArea">
                <img id="sourceImage" alt="Source">
            </div>
            <button type="button" class="btn-crop" id="cropBtn" onclick="performCrop()">Crop & Resize Image ✂️</button>

            <img id="croppedPreview" alt="Cropped Preview">

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom: 5px;">Script Link (Pastebin / Luarmor):</label>
                <input type="text" id="scriptLink" placeholder="https://pastebin.com/..." style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn" style="width: 100%; padding: 12px; background: #10b981; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">Submit to Review Queue 📥</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        // DIARAHKAN KE QUEUE BIN (AGAR MASUK PRIVAT DULU)
        const QUEUE_BIN_ID = "6aef24a9ac6210605a7541d0"; 
        const MASTER_KEY = "$2a$10$7kUozSyzkNytbUxnN7/kv.xInV14ItUgvNAWdjKEswZ0M.DDWgL/e";

        let cropper;
        let finalImageUrl = "";
        const imageInput = document.getElementById('imageInput');
        const sourceImage = document.getElementById('sourceImage');
        const cropperArea = document.getElementById('cropperArea');
        const cropBtn = document.getElementById('cropBtn');
        const croppedPreview = document.getElementById('croppedPreview');

        imageInput.addEventListener('change', function (e) {
            let files = e.target.files;
            if (files && files.length > 0) {
                let file = files.item(0);
                let reader = new FileReader();
                reader.onload = function (event) {
                    sourceImage.src = event.target.result;
                    cropperArea.style.display = 'block';
                    cropBtn.style.display = 'block';
                    croppedPreview.style.display = 'none';

                    if (cropper) { cropper.destroy(); }
                    cropper = new Cropper(sourceImage, { aspectRatio: 16 / 9, viewMode: 1 });
                };
                reader.readAsDataURL(file);
            }
        });

        function performCrop() {
            if (cropper) {
                let canvas = cropper.getCroppedCanvas({ width: 400, height: 225 });
                finalImageUrl = canvas.toDataURL('image/jpeg', 0.6);
                
                croppedPreview.src = finalImageUrl;
                croppedPreview.style.display = 'block';
                cropperArea.style.display = 'none';
                cropBtn.style.display = 'none';
                cropper.destroy();
                alert('Image successfully cropped!');
            }
        }

        async function submitToQueue(event) {
            event.preventDefault();
            let title = document.getElementById('scriptTitle').value;
            let link = document.getElementById('scriptLink').value;
            let submitBtn = document.getElementById('submitBtn');

            if (!finalImageUrl) {
                alert('Please select and crop an image first!');
                return;
            }

            if (!confirm(`Are you sure you want to submit "${title}" to the review queue?`)) return;

            submitBtn.innerText = "Sending to Queue...";
            submitBtn.disabled = true;

            try {
                // 1. Ambil data antrean privat yang ada di Queue Bin
                let getRes = await fetch(`https://api.jsonbin.io/v3/b/${QUEUE_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                let getData = await getRes.json();
                let queue = getData.record || [];

                if (!Array.isArray(queue)) {
                    queue = [];
                }

                // 2. Masukkan script baru ke urutan paling atas antrean
                queue.unshift({
                    title: title,
                    image: finalImageUrl,
                    link: link
                });

                // 3. Simpan kembali ke Queue Bin
                let putRes = await fetch(`https://api.jsonbin.io/v3/b/${QUEUE_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(queue)
                });

                if (putRes.ok) {
                    alert('Success! Script has been sent to the review queue. Waiting for your approval in the Review panel.');
                    window.location.href = 'index.html';
                } else {
                    alert('Failed to submit script.');
                    submitBtn.innerText = "Submit to Review Queue 📥";
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('An error occurred while connecting to the server.');
                submitBtn.innerText = "Submit to Review Queue 📥";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
