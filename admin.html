<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Entropy-Script</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <style>
        .img-container { max-width: 100%; max-height: 300px; margin-bottom: 15px; display: none; }
        .img-container img { max-width: 100%; display: block; }
        .btn-crop { background-color: #333; color: #ffbb00; border: 1px solid #ffbb00; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; display: none; width: 100%; }
        #croppedPreview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; display: none; border: 1px dashed #ffbb00; }
    </style>
</head>
<body>

    <header>
        <h1>ADMIN UPLOAD PANEL</h1>
        <p>Upload thumbnail, crop it, and publish instantly!</p>
    </header>

    <div class="admin-link">
        <a href="index.html">← Back to Home</a>
    </div>

    <div class="admin-form-container">
        <form id="uploadForm" onsubmit="publishScript(event)">
            <div class="form-group">
                <label>Script Title:</label>
                <input type="text" id="scriptTitle" placeholder="Example: Blox Fruits Auto Farm..." required>
            </div>
            
            <div class="form-group">
                <label>Select Image from Gallery:</label>
                <input type="file" id="imageInput" accept="image/*" style="padding: 8px; background: #0f0f0f; color: #fff; border: 1px solid #333; border-radius: 8px; width: 100%;">
            </div>

            <div class="img-container" id="cropperArea">
                <img id="sourceImage" alt="Source">
            </div>
            <button type="button" class="btn-crop" id="cropBtn" onclick="performCrop()">Crop & Resize Image ✂️</button>

            <img id="croppedPreview" alt="Cropped Preview">

            <div class="form-group">
                <label>Script Link (Pastebin / Luarmor):</label>
                <input type="text" id="scriptLink" placeholder="https://pastebin.com/..." required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Publish Script Now 🚀</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        // KREDENSIAL JSONBIN BARU KAMU
        const BIN_ID = "6aef05abac6210605a74f72a";
        const MASTER_KEY = "$2a$10$7kUozSyzkNytbUxnN7/kv.xInV14ItUgvNAWdjKEswZ0M.DDWgL/e";

        let cropper;
        let finalImageUrl = "";
        const imageInput = document.getElementById('imageInput');
        const sourceImage = document.getElementById('sourceImage');
        const cropperArea = document.getElementById('cropperArea');
        const cropBtn = document.getElementById('cropBtn');
        const croppedPreview = document.getElementById('croppedPreview');

        imageInput.addEventListener('change', function (e) {
            let files = e.target.files;
            if (files && files.length > 0) {
                let file = files.item(0);
                let reader = new FileReader();
                reader.onload = function (event) {
                    sourceImage.src = event.target.result;
                    cropperArea.style.display = 'block';
                    cropBtn.style.display = 'block';
                    croppedPreview.style.display = 'none';

                    if (cropper) { cropper.destroy(); }
                    cropper = new Cropper(sourceImage, { aspectRatio: 16 / 9, viewMode: 1 });
                };
                reader.readAsDataURL(file);
            }
        });

        function performCrop() {
            if (cropper) {
                let canvas = cropper.getCroppedCanvas({ width: 400, height: 225 });
                finalImageUrl = canvas.toDataURL('image/jpeg', 0.6);
                
                croppedPreview.src = finalImageUrl;
                croppedPreview.style.display = 'block';
                cropperArea.style.display = 'none';
                cropBtn.style.display = 'none';
                cropper.destroy();
                alert('Image cropped successfully!');
            }
        }

        async function publishScript(event) {
            event.preventDefault();
            let title = document.getElementById('scriptTitle').value;
            let link = document.getElementById('scriptLink').value;
            let submitBtn = document.getElementById('submitBtn');

            if (!finalImageUrl) {
                alert('Please select and crop an image first!');
                return;
            }

            submitBtn.innerText = "Publishing to Website...";
            submitBtn.disabled = true;

            try {
                // 1. Ambil data lama dari JSONBin
                let getRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                let getData = await getRes.json();
                let currentScripts = getData.record || [];

                if (!Array.isArray(currentScripts)) {
                    currentScripts = [];
                }

                // 2. Tambah skrip baru ke urutan paling atas
                currentScripts.unshift({
                    title: title,
                    image: finalImageUrl,
                    link: link
                });

                // 3. Simpan kembali data terbaru ke JSONBin
                let putRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(currentScripts)
                });

                if (putRes.ok) {
                    alert('Script successfully published online for everyone!');
                    window.location.href = 'index.html';
                } else {
                    alert('Failed to publish. Check your settings.');
                    submitBtn.innerText = "Publish Script Now 🚀";
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert('An error occurred.');
                submitBtn.innerText = "Publish Script Now 🚀";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
